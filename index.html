
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입단 서류 작성</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: #f8f7f2;
  color: #42483f;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 480px;
  min-height: 590px;
  background: #ffffff;
  border-radius: 28px;
  padding: 32px 28px;
  box-shadow: 0 10px 40px rgba(80, 90, 70, 0.08);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.top {
  margin-bottom: 35px;
}

.logo {
  font-size: 13px;
  letter-spacing: 2px;
  color: #9ba58e;
  font-weight: 700;
  margin-bottom: 18px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #9a9e93;
  margin-bottom: 9px;
}

.progress-bar {
  height: 5px;
  background: #edf0e9;
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #9eaf91;
  width: 0%;
  transition: width 0.3s;
}

.page {
  display: none;
  flex: 1;
  animation: fadeIn 0.35s ease;
}

.page.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateX(12px); }
  to { opacity: 1; transform: translateX(0); }
}

h1 {
  font-size: 29px;
  line-height: 1.5;
  margin-bottom: 14px;
  font-weight: 700;
  color: #42483f;
}

.description {
  font-size: 15px;
  line-height: 1.8;
  color: #92978c;
  margin-bottom: 30px;
}

.emoji {
  font-size: 55px;
  margin-bottom: 24px;
}

.input {
  width: 100%;
  border: none;
  border-bottom: 2px solid #dfe5d8;
  padding: 15px 5px;
  font-size: 19px;
  outline: none;
  color: #42483f;
  background: transparent;
}

.input:focus {
  border-color: #9eaf91;
}

.input::placeholder {
  color: #c3c8bd;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.option {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 17px;
  border: 1px solid #e8ebe4;
  border-radius: 14px;
  cursor: pointer;
  font-size: 15px;
  transition: 0.2s;
}

.option:has(input:checked) {
  background: #f0f4ec;
  border-color: #a7b89a;
}

.option input {
  width: 19px;
  height: 19px;
  accent-color: #8fa581;
  cursor: pointer;
}

select {
  width: 100%;
  padding: 17px;
  border: 1px solid #e2e7dc;
  border-radius: 13px;
  background: #f8faf6;
  color: #42483f;
  font-size: 16px;
  outline: none;
  cursor: pointer;
}

.navigation {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 35px;
  gap: 12px;
}

button {
  cursor: pointer;
  font-size: 15px;
  border: none;
  border-radius: 13px;
  padding: 15px 23px;
  transition: 0.2s;
}

.prev {
  background: #f1f2ed;
  color: #777f70;
}

.next {
  background: #8fa581;
  color: white;
  flex: 1;
  font-weight: 600;
}

button:active {
  transform: scale(0.97);
}

button:hover {
  opacity: 0.85;
}

.error {
  color: #d77d70;
  font-size: 13px;
  margin-top: 13px;
  min-height: 20px;
}

.complete {
  text-align: center;
  padding-top: 45px;
}

.complete .emoji {
  font-size: 75px;
  margin-bottom: 25px;
}

.complete h1 {
  font-size: 27px;
}

.complete p {
  color: #92978c;
  line-height: 1.9;
  font-size: 15px;
  margin-top: 15px;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #c1c5ba;
  margin-top: 30px;
}

@media (max-width: 500px) {
  body {
    padding: 12px;
  }

  .container {
    min-height: 570px;
    padding: 27px 23px;
    border-radius: 23px;
  }

  h1 {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<div class="container" id="app">

  <div class="top">
    <div class="logo">WELCOME GUIDE</div>

    <div class="progress-info">
      <span>입단 서류 작성</span>
      <span id="pageNumber">1 / 5</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
  </div>

  <!-- PAGE 1 : 환영 -->

  <section class="page active" data-page="0">
    <div class="emoji">🌿</div>
    <h1>환영합니다!</h1>
    <p class="description">
      새로운 시작을 함께하게 되어 기쁩니다.<br>
      아래 버튼을 눌러 입단 서류 작성을 시작해 주세요.
    </p>
  </section>

  <!-- PAGE 2 : 이름 -->

  <section class="page" data-page="1">
    <h1>이름을 알려주세요.</h1>
    <p class="description">
      입단 신청자의 이름을 입력해 주세요.
    </p>

    <input
      type="text"
      class="input"
      id="name"
      placeholder="이름을 입력해 주세요."
      autocomplete="name"
      maxlength="30"
    >
  </section>

  <!-- PAGE 3 : 체크박스 -->

  <section class="page" data-page="2">
    <h1>해당 항목을 선택해 주세요.</h1>
    <p class="description">
      해당하는 항목을 모두 선택해 주세요.
    </p>

    <div class="options">

      <label class="option">
        <input type="checkbox" value="정기 모임 참여">
        정기 모임 참여
      </label>

      <label class="option">
        <input type="checkbox" value="행사 및 공연 참여">
        행사 및 공연 참여
      </label>

      <label class="option">
        <input type="checkbox" value="공지사항 확인">
        공지사항 확인
      </label>

      <label class="option">
        <input type="checkbox" value="기타 활동 참여">
        기타 활동 참여
      </label>

    </div>
  </section>

  <!-- PAGE 4 : 나이 -->

  <section class="page" data-page="3">
    <h1>나이를 선택해 주세요.</h1>
    <p class="description">
      해당하는 나이를 선택해 주세요.
    </p>

    <select id="age">
      <option value="">나이를 선택해 주세요.</option>
      <option value="10대">10대</option>
      <option value="20대">20대</option>
      <option value="30대">30대</option>
      <option value="40대">40대</option>
      <option value="50대">50대</option>
      <option value="60대">60대</option>
      <option value="70대 이상">70대 이상</option>
    </select>
  </section>

  <!-- PAGE 5 : 완료 -->

  <section class="page" data-page="4">
    <div class="complete">
      <div class="emoji">🎉🎊🎉</div>
      <h1>입단 서류가<br>작성되었습니다!</h1>
      <p>
        소중한 인연을 맺게 되어 기쁩니다.<br>
        함께할 시간을 기대하겠습니다.<br><br>
        감사합니다!
      </p>
    </div>
  </section>

  <div class="error" id="error"></div>

  <!-- 이전 / 다음 버튼 -->

  <div class="navigation">
    <button class="prev" id="prevBtn" onclick="move(-1)">
      ← 이전
    </button>

    <button class="next" id="nextBtn" onclick="move(1)">
      다음 →
    </button>
  </div>

  <div class="footer">
    THANK YOU FOR JOINING US
  </div>

</div>

<script>

// 저장된 내용 불러오기
const STORAGE_KEY = "membershipForm_v1";

let saved = {};

try {
  saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
} catch (e) {
  saved = {};
}

let currentPage = 0;

// 이름 복원
document.getElementById("name").value =
  saved.name || "";

// 체크박스 복원
document.querySelectorAll(
  '.options input[type="checkbox"]'
).forEach(input => {
  input.checked =
    (saved.selected || []).includes(input.value);
});

// 나이 복원
document.getElementById("age").value =
  saved.age || "";

// 입력 내용 저장
function saveData() {
  const selected = [];

  document.querySelectorAll(
    '.options input[type="checkbox"]:checked'
  ).forEach(input => {
    selected.push(input.value);
  });

  const data = {
    name: document.getElementById("name").value,
    selected: selected,
    age: document.getElementById("age").value,
    page: currentPage
  };

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}

// 입력 변경 시 자동 저장
document.getElementById("name")
  .addEventListener("input", saveData);

document.getElementById("age")
  .addEventListener("change", saveData);

document.querySelectorAll(
  '.options input[type="checkbox"]'
).forEach(input => {
  input.addEventListener("change", saveData);
});

// 페이지 표시
function showPage() {

 document.querySelectorAll(".page").forEach(
 (page, index) => {
 page.classList.toggle(
 "active",
 index === currentPage
 );
    }
 );

 document.getElementById("pageNumber").textContent =
 (currentPage + 1) + " / 5";

 document.getElementById("progress").style.width =
 ((currentPage + 1) / 5 * 100) + "%";

 document.getElementById("prevBtn").style.visibility =
 currentPage === 0 ? "hidden" : "visible";

 document.getElementById("nextBtn").textContent =
 currentPage === 4? "Done": "Next →";

 document.getElementById("nextBtn").style.display =
 currentPage === 4 ? "none" : "block";

 document.getElementById("error").textContent = "";

 saveData();
}

// Input check
function validatePage() {

 if (currentPage === 1) {
 const name = document.getElementById("name")
 .value.trim();

 if (!name) {
 showError("Please enter a name.");
 return false;
    }
  }

 if (currentPage === 2) {
 const selected = document.querySelectorAll(
      '.options input[type="checkbox"]:checked'
 );

 if (selected.length === 0) {
 showError("Please select at least one item.");
 return false;
    }
  }

 if (currentPage === 3) {
 if (!document.getElementById("age").value) {
 showError ("Please select your age".");
 return false;
    }
  }

 return true;
}

function showError(message) {
 document.getElementById("error").textContent =
 message;
}

// Move the page
function move(direction) {

 if (direction === 1 && !validatePage()) {
 return;
  }

 const nextPage = currentPage + direction;

 if (nextPage < 0 || nextPage > 4) {
 return;
  }

 currentPage = nextPage;

 saveData();
 showPage();
}

// Keyboard left and right direction keys
document.addEventListener("keydown", event => {

  if (
 event.target.tagName === "INPUT" ||
 event.target.tagName === "SELECT"
 ) return;

 if (event.key === "ArrowRight") move(1);
 if (event.key === "ArrowLeft") move(-1);

});

// Smartphone left and right swipes
let touchStartX = 0;
let touchEndX = 0;

const app = document.getElementById("app");

app.addEventListener("touchstart", event => {
 touchStartX = event.changedTouches[0].screenX;
}, { passive: true });

app.addEventListener("touchend", event => {

 touchEndX = event.changedTouches[0].screenX;

 const difference = touchEndX - touchStartX;

 if (Math.abs(difference) < 70) return;

 // Prevent swipe movement when operating the input window
 if (
 ["INPUT", "SELECT", "BUTTON"].includes(
 document.activeElement.tagName
 )
 ) return;

 if (difference < 0) move(1);
 else move(-1);

}, { passive: true });

// Displaying the screen for the first time
showPage();

</script>

</body>
</html>
